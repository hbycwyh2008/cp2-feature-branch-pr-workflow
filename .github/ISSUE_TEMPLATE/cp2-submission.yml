name: "Submit CP2"
description: "Submit your public CP2 practice repository for automatic and teacher grading."
title: "[CP2] Feature Branch & Pull Request Submission"
body:
  - type: markdown
    attributes:
      value: |
        The completed public CP2 repository is detected automatically from the GitHub account that opens this submission. The mother grader then inspects its branch, Pull Request, and submission evidence.

  - type: markdown
    attributes:
      value: |
        **Repository URL and GitHub username are detected automatically from the account that opens this submission.**
        The detected repository URL will be written into this Issue automatically.

  - type: checkboxes
    id: integrity
    attributes:
      label: Integrity Check
      options:
        - label: I used the official KLIS-CS CP2 Copy Exercise.
          required: true
        - label: My required cp2-USERNAME branch and open Pull Request are visible in this repository.
          required: true
        - label: I did not include passwords, API keys, tokens, or other secrets.
          required: true
