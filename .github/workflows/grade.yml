name: Checkpoint 2 — Auto and Teacher Grade

on:
  push:
    branches: ['cp2-*']
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
    branches: [main]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  grade:
    if: >-
      ${{
        github.event_name == 'push' ||
        github.event_name == 'pull_request_target' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Grade checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp2-progress -->';
            const starter = 'STARTER: Replace this line on your CP2 feature branch with a short description of your change.';
            const allowedGraders = new Set(['hbycwyh2008']);

            function parseManualGrade(body) {
              if (!body) return null;

              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, format: 'short' };

              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;

              const readScore = (label, max) => {
                const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const re = new RegExp(`^\\s*${escaped}:\\s*(\\d{1,2})\\s*\\/\\s*${max}\\s*$`, 'mi');
                const m = body.match(re);
                if (!m) return null;
                const n = Number(m[1]);
                return n <= max ? n : null;
              };

              const breakdown = {
                branch: readScore('Branch safety', 10),
                workflow: readScore('Git workflow explanation', 10),
                pr: readScore('Pull Request understanding', 10),
                reflection: readScore('Reflection & work quality', 10)
              };

              if (Object.values(breakdown).some(v => v === null)) return null;
              return {
                score: breakdown.branch + breakdown.workflow + breakdown.pr + breakdown.reflection,
                breakdown,
                format: 'template'
              };
            }

            let eventPR = null;
            if (context.eventName === 'pull_request_target') eventPR = context.payload.pull_request;
            if (context.eventName === 'issue_comment') {
              eventPR = (await github.rest.pulls.get({
                owner,
                repo,
                pull_number: context.payload.issue.number
              })).data;
            }

            const username = eventPR ? eventPR.user.login : context.actor;
            const expectedBranch = `cp2-${username}`;
            const branch = eventPR ? eventPR.head.ref : context.ref.replace(/^refs\/heads\//, '');
            const branchNameCorrect = branch.toLowerCase() === expectedBranch.toLowerCase();

            let branchExists = false;
            try {
              await github.rest.repos.getBranch({ owner, repo, branch });
              branchExists = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const read = async (path, ref) => {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref });
                if (Array.isArray(r.data) || !r.data.content) return '';
                return Buffer.from(r.data.content, r.data.encoding).toString('utf8');
              } catch (e) {
                if (e.status === 404) return '';
                throw e;
              }
            };

            const mainFeature = await read('feature.txt', 'main');
            const branchFeature = branchExists ? await read('feature.txt', branch) : '';
            const mainSafe = mainFeature.trim() === starter;
            const featureChanged = branchExists && branchFeature.trim() !== starter && branchFeature.trim().length >= 20;

            let ahead = 0;
            if (branchExists) {
              try {
                const compare = await github.rest.repos.compareCommits({ owner, repo, base: 'main', head: branch });
                ahead = compare.data.ahead_by || 0;
              } catch (e) {
                core.info(`Compare failed: ${e.message}`);
              }
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'all', per_page: 100
            });
            const pr = pulls.find(p =>
              p.head.ref === branch &&
              p.base.ref === 'main' &&
              p.user.login.toLowerCase() === username.toLowerCase() &&
              p.state === 'open'
            );

            let allowedFiles = false;
            let changedNames = [];
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              changedNames = files.map(f => f.filename);
              const allowed = new Set(['feature.txt', 'submission.md']);
              allowedFiles =
                changedNames.includes('feature.txt') &&
                changedNames.includes('submission.md') &&
                changedNames.every(name => allowed.has(name));
            }

            // Grade submission.md from the actual feature branch, never from main.
            const submission = branchExists ? await read('submission.md', branch) : '';
            const field = label => submission.match(new RegExp(`^${label}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading => submission.match(new RegExp(`## ${heading}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';
            const commandBlock = submission.match(/## Commands Used[\s\S]*?```text\s*([\s\S]*?)```/i)?.[1]?.trim() || '';

            const submittedUsername = field('GitHub Username').replace(/^@/, '').trim();
            const submittedBranch = field('Required Branch').replace(/^`|`$/g, '').trim();
            const submissionMetadataCorrect =
              submittedUsername.toLowerCase() === username.toLowerCase() &&
              submittedBranch.toLowerCase() === branch.toLowerCase();

            const submissionComplete =
              !!field('Name') &&
              !!submittedUsername &&
              !!submittedBranch &&
              submissionMetadataCorrect &&
              commandBlock.length >= 10 &&
              ['Question 1', 'Question 2', 'Question 3', 'Reflection'].every(answer);

            const checks = [
              ['Correct checkpoint branch name', branchExists && branchNameCorrect ? 10 : 0, 10, branchExists && branchNameCorrect ? branch : `found ${branch || 'no branch'}; expected ${expectedBranch}`],
              ['main remained untouched', mainSafe ? 10 : 0, 10, mainSafe ? 'starter file unchanged on main' : 'feature.txt on main was modified'],
              ['feature.txt changed on CP2 branch', featureChanged ? 10 : 0, 10, featureChanged ? 'branch feature change detected' : 'replace the starter line on the CP2 branch'],
              ['Branch has commit(s) ahead of main', ahead >= 1 ? 10 : 0, 10, ahead >= 1 ? `${ahead} commit(s) ahead` : 'commit your work on the CP2 branch'],
              ['Open Pull Request targets main', pr ? 10 : 0, 10, pr ? `PR #${pr.number}` : 'open the required Pull Request'],
              ['PR changes only allowed files', allowedFiles ? 5 : 0, 5, allowedFiles ? changedNames.join(', ') : (pr ? `changed: ${changedNames.join(', ') || 'none'}` : 'waiting for PR')],
              ['Submission complete on feature branch', submissionComplete ? 5 : 0, 5, submissionComplete ? `read from ${branch}; username and branch metadata match` : `complete submission.md on ${branch || expectedBranch}; GitHub Username and Required Branch must match the actual PR branch`]
            ];

            const automatic = checks.reduce((s, c) => s + c[1], 0);

            let prComments = [];
            let manual = null;
            if (pr) {
              prComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              for (const c of [...prComments].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))) {
                if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
                const parsed = parseManualGrade(c.body || '');
                if (parsed) {
                  manual = { ...parsed, grader: c.user.login };
                  break;
                }
              }
            }

            const teacher = manual?.score ?? 0;
            const total = automatic + teacher;
            const rows = checks.map(([label, earned, max, detail]) =>
              `| ${earned === max ? '✅' : earned ? '🟨' : '⬜'} ${label} | ${earned}/${max} | ${detail} |`
            ).join('\n');

            const status = automatic < 60
              ? '🟡 **IN PROGRESS — complete the missing automatic evidence.**'
              : !manual
                ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review.**'
                : `✅ **FINAL SCORE: ${total}/100**`;

            const breakdownText = manual?.breakdown
              ? `Branch safety ${manual.breakdown.branch}/10 · Git workflow explanation ${manual.breakdown.workflow}/10 · Pull Request understanding ${manual.breakdown.pr}/10 · Reflection & work quality ${manual.breakdown.reflection}/10`
              : manual
                ? 'Teacher used the short-form manual score.'
                : 'Not graded yet.';

            const teacherTemplate = [
              '```text',
              '/manual-grade',
              'Branch safety: 0/10',
              'Git workflow explanation: 0/10',
              'Pull Request understanding: 0/10',
              'Reflection & work quality: 0/10',
              '',
              'Feedback:',
              'Write concise feedback here.',
              '```'
            ].join('\n');

            const defaultTeacherBlock = `<!-- klis-cp2-teacher-sync-start -->
            ### 🧑‍🏫 Teacher review

            **Teacher score:** awaiting review  
            **Final score:** pending teacher review

            Teacher feedback will appear here after grading in the mother repository.
            <!-- klis-cp2-teacher-sync-end -->`;

            const progressBody = `${marker}
            ## CP2 — Progress & Score

            **Student:** @${username}  
            **Repository:** https://github.com/${owner}/${repo}  
            **Automatic score:** ${automatic}/60

            | Check | Score | Evidence |
            |---|---:|---|
            ${rows}

            ${automatic < 60 ? "🟡 **IN PROGRESS — complete the unchecked automatic requirements.**" : "🔵 **AUTOMATIC CHECKS PASSED — ready for teacher review.**"}

            **If a row is not complete, fix that item on the feature branch and push again. This same score table will update automatically.**

            ## Submit for teacher review

            [Submit CP2 to the mother repository](https://github.com/KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow/issues/new?template=cp2-submission.yml)

            ${defaultTeacherBlock}`;

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            let exercise = allIssues.find(i => !i.pull_request && i.body?.includes('<!-- klis-cp2-exercise -->'));
            if (!exercise) {
              exercise = (await github.rest.issues.create({
                owner,
                repo,
                title: 'Exercise: Checkpoint 2 — Feature Branch & Pull Request Workflow',
                body: '<!-- klis-cp2-exercise -->\n## Checkpoint 2 — Feature Branch & Pull Request Workflow'
              })).data;
            }

            const exerciseComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const old = exerciseComments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            let finalProgressBody = progressBody;
            const teacherMatch = old?.body?.match(/<!-- klis-cp2-teacher-sync-start -->[\s\S]*?<!-- klis-cp2-teacher-sync-end -->/);
            if (teacherMatch) finalProgressBody = finalProgressBody.replace(defaultTeacherBlock, teacherMatch[0]);

            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body: finalProgressBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: exercise.number, body: finalProgressBody });
            }

            await core.summary
              .addHeading(`Checkpoint 2: ${total}/100`)
              .addRaw(`Automatic: ${automatic}/60\n`)
              .addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`)
              .write();

            if (automatic !== 60 && ['push', 'pull_request_target'].includes(context.eventName)) {
              core.setFailed(`Automatic score is ${automatic}/60.`);
            }
