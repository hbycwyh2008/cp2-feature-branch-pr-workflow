name: Start Exercise

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp2-exercise -->';
            const username = context.actor;
            const branch = `cp2-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));
            if (existing) {
              core.info(`Exercise issue already exists: #${existing.number}`);
              return;
            }

            const body = `${marker}
            ## Checkpoint 2 — Feature Branch & Pull Request Workflow

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task

            - [ ] Clone the repository.
            - [ ] Create and switch to `${branch}`. Do not implement the checkpoint directly on `main`.
            - [ ] Update only `feature.txt` and `submission.md`.
            - [ ] Commit and push `${branch}`.
            - [ ] Open a Pull Request from `${branch}` → `main`.
            - [ ] Request review from another GitHub user.
            - [ ] Receive an **APPROVED** review.

            GitHub detects the Pull Request automatically. You do **not** enter a PR number manually.

            ### Automatic grading

            The grader updates the checklist and score **below in this same Issue** whenever you push the feature branch, open or update the Pull Request, or receive a review.
            `;

            await github.rest.issues.create({
              owner,
              repo,
              title: 'Exercise: Checkpoint 2 — Feature Branch & Pull Request Workflow',
              body
            });
