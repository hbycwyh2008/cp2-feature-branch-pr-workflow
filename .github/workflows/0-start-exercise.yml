name: Start Exercise

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  start:
    if: ${{ github.repository != 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create checkpoint issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- klis-cp2-exercise -->';
            const username = context.actor;
            const branch = `cp2-${username}`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.body?.includes(marker));

            const body = `${marker}
            ## Checkpoint 2 — Feature Branch & Pull Request Workflow

            Welcome @${username}.

            **Required branch:** \`${branch}\`

            ### Your task

            - [ ] Clone the repository.
            - [ ] Create and switch to \`${branch}\`. Do not implement the checkpoint directly on \`main\`.
            - [ ] Update only \`feature.txt\` and \`submission.md\`.
            - [ ] Commit and push \`${branch}\`.
            - [ ] Open a Pull Request from \`${branch}\` → \`main\`.

            GitHub detects the Pull Request automatically. You do **not** enter a PR number manually.

            ### Automatic grading

            The grader updates the checklist and score **below in this same Issue** whenever you push the feature branch or open/update the Pull Request.
            `;

            let exercise = existing;
            if (!exercise) {
              exercise = (await github.rest.issues.create({
                owner,
                repo,
                title: 'Exercise: Checkpoint 2 — Feature Branch & Pull Request Workflow',
                body
              })).data;
            }

            const progressMarker = '<!-- klis-cp2-progress -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: exercise.number, per_page: 100
            });
            const progressExists = comments.some(c => c.body?.includes(progressMarker));
            if (!progressExists) {
              const progressBody = [
                progressMarker,
                '## CP2 — Progress & Score',
                '',
                `**Student:** @${username}  `,
                `**Repository:** https://github.com/${owner}/${repo}  `,
                '**Automatic score:** 0/60',
                '',
                '| Check | Score | Evidence |',
                '|---|---:|---|',
                `| ⬜ Correct checkpoint branch identity | 0/10 | Create ${branch}. |`,
                '| ⬜ feature.txt changed on feature branch | 0/10 | Replace the starter line. |',
                '| ⬜ Commit evidence on feature branch | 0/10 | Commit the CP2 work. |',
                '| ⬜ Pull Request targets main | 0/15 | Open the required Pull Request. |',
                '| ⬜ PR changes only allowed files | 0/5 | Waiting for Pull Request. |',
                '| ⬜ Submission complete on PR head | 0/10 | Complete submission.md on the CP2 branch. |',
                '',
                '🟡 **IN PROGRESS — complete the missing automatic evidence.**',
                '',
                '<!-- klis-cp2-teacher-sync-start -->',
                '### 🧑‍🏫 Teacher review — 40 points',
                '',
                '**Teacher score:** awaiting review  ',
                '**Final score:** pending teacher review',
                '',
                '#### Teacher grading template',
                '',
                'Use this in the mother-repository CP2 submission Issue:',
                '',
                '```text',
                '/manual-grade',
                'Branch safety: 0/10',
                'Git workflow explanation: 0/10',
                'Pull Request understanding: 0/10',
                'Reflection & work quality: 0/10',
                '',
                'Feedback:',
                'Write concise feedback here.',
                '```',
                '<!-- klis-cp2-teacher-sync-end -->'
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number: exercise.number, body: progressBody
              });
            }
