name: CP2 — Mother Repository Grader

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write

jobs:
  grade:
    if: >-
      ${{
        github.repository == 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow' &&
        !github.event.issue.pull_request &&
        (
          startsWith(github.event.issue.title, '[CP2] Feature Branch & Pull Request Submission') ||
          contains(github.event.issue.body, '### Practice Repository URL')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Grade CP2 submission
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const student = issue.user.login;
            const marker = '<!-- klis-cp2-mother-score -->';
            const localMarker = '<!-- klis-cp2-progress -->';
            const allowedGraders = new Set(['hbycwyh2008']);

            const escapeRegex = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const section = label => {
              const re = new RegExp(`### ${escapeRegex(label)}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const value = issue.body?.match(re)?.[1]?.trim() || '';
              return value === '_No response_' ? '' : value;
            };

            function parseRepoUrl(value) {
              try {
                const u = new URL((value || '').trim());
                if (u.protocol !== 'https:' || u.hostname.toLowerCase() !== 'github.com') return null;
                const parts = u.pathname.split('/').filter(Boolean);
                if (parts.length < 2) return null;
                return { owner: parts[0], repo: parts[1].replace(/\.git$/i, '') };
              } catch { return null; }
            }

            async function publicJson(url) {
              const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'KLIS-CS-CP2-Mother-Grader' } });
              if (r.status === 404) return null;
              if (r.status === 403 || r.status === 429) throw new Error('GitHub API rate limit reached. Re-run later; this is not a student error.');
              if (!r.ok) throw new Error(`GitHub API returned ${r.status} for ${url}`);
              return await r.json();
            }

            async function publicText(url) {
              const r = await fetch(url, { headers: { 'User-Agent': 'KLIS-CS-CP2-Mother-Grader' } });
              if (r.status === 404) return '';
              if (r.status === 403 || r.status === 429) throw new Error('GitHub public API rate limit reached. Re-run later; this is not a student error.');
              if (!r.ok) throw new Error(`Unable to read repository file (${r.status}).`);
              return await r.text();
            }

            function parseManualGrade(body) {
              if (!body) return null;
              const legacy = body.match(/(?:^|\n)\s*\/manual-grade\s+(40|[0-3]?\d)(?:\s|$)/i);
              if (legacy) return { score: Number(legacy[1]), breakdown: null, feedback: '' };
              if (!/(?:^|\n)\s*\/manual-grade\s*(?:\n|$)/i.test(body)) return null;
              const readTen = label => {
                const m = body.match(new RegExp(`^\\s*${escapeRegex(label)}:\\s*(10|[0-9])\\s*\\/\\s*10\\s*$`, 'mi'));
                return m ? Number(m[1]) : null;
              };
              const breakdown = {
                branch: readTen('Branch safety'),
                workflow: readTen('Git workflow explanation'),
                pr: readTen('Pull Request understanding'),
                reflection: readTen('Reflection & work quality')
              };
              if (Object.values(breakdown).some(v => v === null)) return null;
              const feedback = body.match(/(?:^|\n)\s*Feedback:\s*\n([\s\S]*)$/i)?.[1]?.trim() || '';
              return { score: Object.values(breakdown).reduce((a,b) => a+b, 0), breakdown, feedback };
            }

            async function discoverRepositoryUrl() {
              try {
                const exact = await github.rest.repos.get({ owner: student, repo: 'cp2-feature-branch-pr-workflow' });
                if (exact.data && exact.data.private === false) return exact.data.html_url;
              } catch (error) {
                if (error.status !== 404) core.warning(`Exact CP2 repository lookup failed: ${error.message}`);
              }

              const repos = await github.paginate(github.rest.repos.listForUser, {
                username: student, per_page: 100, sort: 'updated', direction: 'desc'
              });
              for (const candidate of repos.slice(0, 40)) {
                if (candidate.private) continue;
                try {
                  const details = await github.rest.repos.get({ owner: student, repo: candidate.name });
                  if (details.data.template_repository?.full_name === 'KLIS-CS/GitHub-Feature-Branch-Pull-Request-Workflow') return details.data.html_url;

                  const workflow = await github.rest.repos.getContent({
                    owner: student,
                    repo: candidate.name,
                    path: '.github/workflows/grade.yml',
                    ref: candidate.default_branch || 'main'
                  });
                  if (!Array.isArray(workflow.data) && workflow.data.content) {
                    const text = Buffer.from(workflow.data.content, workflow.data.encoding).toString('utf8');
                    if (text.includes('klis-cp2-progress')) return candidate.html_url;
                  }
                } catch (error) {
                  if (error.status !== 404) core.warning(`Skipping ${candidate.name}: ${error.message}`);
                }
              }
              return '';
            }

            let repositoryUrl = section('Practice Repository URL');
            if (!repositoryUrl) repositoryUrl = await discoverRepositoryUrl();
            const statedUsername = section('GitHub Username').replace(/^@/, '').trim() || student;

            if (repositoryUrl && !section('Practice Repository URL')) {
              const autoDetected = [
                issue.body || '',
                '',
                '### Practice Repository URL',
                repositoryUrl,
                '',
                '### GitHub Username',
                student
              ].join('\n');
              await github.rest.issues.update({
                owner, repo, issue_number: issueNumber, body: autoDetected
              });
            }

            const parsed = parseRepoUrl(repositoryUrl);

            const expectedBranch = `cp2-${student}`;
            const starter = 'STARTER: Replace this line on your CP2 feature branch with a short description of your change.';

            let branchExists = false;
            let mainFeature = '';
            let branchFeature = '';
            let submission = '';
            let ahead = 0;
            let changedNames = [];
            let pr = null;
            let validation = 'Repository URL could not be parsed.';

            if (parsed) {
              const cloneUrl = `https://github.com/${parsed.owner}/${parsed.repo}.git`;
              const workDir = fs.mkdtempSync(path.join(os.tmpdir(), 'klis-cp2-'));

              const git = args => execFileSync('git', ['-C', workDir, ...args], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe']
              }).trim();

              const gitShow = (ref, filePath) => {
                try {
                  return git(['show', `${ref}:${filePath}`]);
                } catch {
                  return '';
                }
              };

              try {
                execFileSync('git', ['clone', '--quiet', '--no-checkout', cloneUrl, workDir], {
                  encoding: 'utf8',
                  stdio: ['ignore', 'pipe', 'pipe']
                });

                validation = 'Public student repository cloned successfully.';

                const mainSha = git(['rev-parse', 'origin/main']);
                mainFeature = gitShow('origin/main', 'feature.txt');

                let branchSha = '';
                try {
                  git(['fetch', '--quiet', 'origin', expectedBranch]);
                  branchSha = git(['rev-parse', 'FETCH_HEAD']);
                  branchExists = Boolean(branchSha);
                } catch {
                  branchExists = false;
                }

                if (branchExists) {
                  branchFeature = gitShow(branchSha, 'feature.txt');
                  submission = gitShow(branchSha, 'submission.md');

                  try {
                    ahead = Number(git(['rev-list', '--count', `${mainSha}..${branchSha}`])) || 0;
                  } catch {
                    ahead = 0;
                  }

                  try {
                    changedNames = git(['diff', '--name-only', `${mainSha}...${branchSha}`])
                      .split(/\r?\n/)
                      .map(s => s.trim())
                      .filter(Boolean);
                  } catch {
                    changedNames = [];
                  }

                  // GitHub exposes merge refs for open Pull Requests.
                  // Match the PR merge ref whose second parent is this checkpoint branch.
                  let mergeRefs = '';
                  try {
                    mergeRefs = execFileSync('git', ['ls-remote', cloneUrl, 'refs/pull/*/merge'], {
                      encoding: 'utf8',
                      stdio: ['ignore', 'pipe', 'pipe']
                    }).trim();
                  } catch {
                    mergeRefs = '';
                  }

                  for (const line of mergeRefs.split(/\r?\n/).filter(Boolean)) {
                    const ref = line.split(/\s+/)[1] || '';
                    const m = ref.match(/^refs\/pull\/(\d+)\/merge$/);
                    if (!m) continue;

                    try {
                      git(['fetch', '--quiet', 'origin', ref]);
                      const mergeSha = git(['rev-parse', 'FETCH_HEAD']);
                      const headParent = git(['rev-parse', `${mergeSha}^2`]);
                      const baseParent = git(['rev-parse', `${mergeSha}^1`]);
                      let baseIsMain = false;
                      try {
                        execFileSync('git', ['-C', workDir, 'merge-base', '--is-ancestor', baseParent, mainSha], {
                          stdio: ['ignore', 'ignore', 'ignore']
                        });
                        baseIsMain = true;
                      } catch {
                        baseIsMain = false;
                      }

                      if (headParent === branchSha && baseIsMain) {
                        pr = {
                          number: Number(m[1]),
                          html_url: `https://github.com/${parsed.owner}/${parsed.repo}/pull/${m[1]}`
                        };
                        break;
                      }
                    } catch {
                      // Ignore stale or non-mergeable PR refs and continue.
                    }
                  }
                }
              } catch (error) {
                validation = `Unable to clone public student repository: ${error.message}`;
              } finally {
                fs.rmSync(workDir, { recursive: true, force: true });
              }
            }

            const mainSafe = mainFeature.trim() === starter;
            const featureChanged =
              branchExists &&
              branchFeature.trim() !== starter &&
              branchFeature.trim().length >= 20;

            const allowed = new Set(['feature.txt', 'submission.md']);
            const allowedFiles =
              Boolean(pr) &&
              changedNames.includes('feature.txt') &&
              changedNames.includes('submission.md') &&
              changedNames.every(name => allowed.has(name));

            const field = label =>
              submission.match(new RegExp(`^${escapeRegex(label)}:\\s*(\\S.*)$`, 'mi'))?.[1]?.trim() || '';
            const answer = heading =>
              submission.match(new RegExp(`## ${escapeRegex(heading)}[\\s\\S]*?\\nAnswer:\\s*([\\s\\S]*?)(?=\\n## |$)`, 'i'))?.[1]?.trim() || '';
            const commandBlock =
              submission.match(/## Commands Used[\s\S]*?```text\s*([\s\S]*?)```/i)?.[1]?.trim() || '';

            const submittedUsername = field('GitHub Username').replace(/^@/, '').trim();
            const submittedBranch = field('Required Branch').replace(/^`|`$/g, '').trim();

            const submissionMetadataCorrect =
              submittedUsername.toLowerCase() === student.toLowerCase() &&
              submittedBranch.toLowerCase() === expectedBranch.toLowerCase();

            const submissionComplete =
              Boolean(field('Name')) &&
              Boolean(submittedUsername) &&
              Boolean(submittedBranch) &&
              submissionMetadataCorrect &&
              commandBlock.length >= 10 &&
              ['Question 1', 'Question 2', 'Question 3', 'Reflection'].every(label => Boolean(answer(label)));

            const checks = [
              ['Correct checkpoint branch', branchExists ? 10 : 0, 10,
                branchExists ? expectedBranch : `create and push ${expectedBranch}`],
              ['main remained untouched', mainSafe ? 10 : 0, 10,
                mainSafe ? 'starter file unchanged on main' : 'restore feature.txt on main; CP2 work belongs on the checkpoint branch'],
              ['feature.txt changed on CP2 branch', featureChanged ? 10 : 0, 10,
                featureChanged ? 'branch feature change detected' : `edit feature.txt on ${expectedBranch}, not on main`],
              ['Branch has commit(s) ahead of main', ahead >= 1 ? 10 : 0, 10,
                ahead >= 1 ? `${ahead} commit(s) ahead of main` : `commit work on ${expectedBranch}`],
              ['Open Pull Request targets main', pr ? 10 : 0, 10,
                pr ? `PR #${pr.number}: ${expectedBranch} → main` : `open a Pull Request from ${expectedBranch} to main`],
              ['PR changes only allowed files', allowedFiles ? 5 : 0, 5,
                allowedFiles ? changedNames.join(', ') : (pr ? `changed: ${changedNames.join(', ') || 'none'}; only feature.txt and submission.md are allowed` : 'waiting for the required Pull Request')],
              ['Submission complete on checkpoint branch', submissionComplete ? 5 : 0, 5,
                submissionComplete
                  ? `submission.md read from ${expectedBranch}; username and branch metadata match`
                  : `complete submission.md on ${expectedBranch}; Name, GitHub Username, Required Branch, commands, answers, and reflection must be complete`]
            ];

            const automatic = checks.reduce((sum, [, earned]) => sum + earned, 0);
            const automaticChecklist = checks.map(([label, earned, max, detail]) => [
              `- [${earned === max ? 'x' : ' '}] **${label}** — **${earned}/${max}**`,
              `  - ${earned === max ? '**Evidence:**' : '**Fix:**'} ${detail}`
            ].join('\n')).join('\n');

            const progressUrl = pr?.html_url ||
              (parsed ? `https://github.com/${parsed.owner}/${parsed.repo}/tree/${expectedBranch}` : null);

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
            let manual = null;
            for (const c of [...comments].sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at))) {
              if (!allowedGraders.has(c.user?.login?.toLowerCase())) continue;
              const grade = parseManualGrade(c.body || '');
              if (grade) { manual = { ...grade, grader: c.user.login }; break; }
            }

            const teacher = manual?.score ?? 0;
            const total = automatic + teacher;
            const finalLine = manual ? `${total}/100` : 'pending teacher review';
            const status = automatic < 60 ? '🟡 **IN PROGRESS — complete the unchecked items on the checkpoint branch.**' : !manual ? '🔵 **AUTOMATIC CHECKS PASSED — awaiting teacher review.**' : `✅ **FINAL SCORE: ${total}/100**`;
            const template = ['```text','/manual-grade','Branch safety: 0/10','Git workflow explanation: 0/10','Pull Request understanding: 0/10','Reflection & work quality: 0/10','','Feedback:','Write concise feedback here.','```'].join('\n');
            const canonicalRepo = parsed ? `https://github.com/${parsed.owner}/${parsed.repo}` : repositoryUrl;

            const teacherChecklist = manual
              ? `- [x] **Teacher review completed** — **${teacher}/40**\n  - **Evidence:** graded by @${manual.grader}`
              : '- [ ] **Teacher review pending** — **—/40**\n  - **Next step:** teacher reviews the branch work, explanations, Pull Request, and reflection.';

            const body = `${marker}
            ## CP2 Score — Mother Repository

            **Student:** @${student}  
            **Repository:** ${canonicalRepo || 'not detected'}  
            **Checkpoint branch:** <code>cp2-${student}</code>  
            **Automatic:** **${automatic}/60**  
            **Teacher:** **${manual ? `${teacher}/40` : 'pending /40'}**  
            **Final:** **${finalLine}**

            ${status}

            ### ✅ Automatic checklist — ${automatic}/60

            ${automaticChecklist}

            > **Checked = passed. Unchecked = action required.**  
            > All student files and answers are checked on the <code>cp2-${student}</code> branch. A merge to <code>main</code> is **not** required.

            ### 🧑‍🏫 Teacher review — ${manual ? `${teacher}/40` : 'pending /40'}

            ${teacherChecklist}

            ### Review links
            - ${canonicalRepo ? `[Open student repository](${canonicalRepo})` : 'Student repository unavailable'}
            - ${progressUrl ? `[Open checkpoint branch / Pull Request](${progressUrl})` : 'Checkpoint branch evidence not found'}

            ### Teacher grading command

            ${template}

            **Re-grade:** after the student fixes work on the checkpoint branch and pushes again, edit this submission Issue or add a comment.
            `;

            const old = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });

            if (manual && parsed?.owner) {
              const gradeBranch = 'grades';
              try { await github.rest.git.getRef({ owner, repo, ref: `heads/${gradeBranch}` }); }
              catch (e) {
                if (e.status !== 404) throw e;
                const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${gradeBranch}`, sha: mainRef.data.object.sha });
              }
              const gradePath = `.cp2-grades/${student.toLowerCase()}.json`;
              const gradeData = { version: 1, checkpoint: 'CP2', student: student.toLowerCase(), repository: canonicalRepo, automaticAtMother: automatic, teacherScore: teacher, finalAtMother: total, grader: manual.grader, breakdown: manual.breakdown, feedback: manual.feedback || '', submissionIssue: `https://github.com/${owner}/${repo}/issues/${issueNumber}`, updatedAt: new Date().toISOString() };
              let sha;
              try { const current = await github.rest.repos.getContent({ owner, repo, path: gradePath, ref: gradeBranch }); if (!Array.isArray(current.data)) sha = current.data.sha; }
              catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: gradePath, branch: gradeBranch, message: `Publish CP2 teacher grade for ${student}`, content: Buffer.from(JSON.stringify(gradeData, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) });
            }

            await core.summary.addHeading(`CP2: ${total}/100`).addRaw(`Automatic: ${automatic}/60\n`).addRaw(`Teacher: ${manual ? `${teacher}/40` : 'awaiting review'}\n`).write();
